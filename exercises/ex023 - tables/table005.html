<!DOCTYPE html>
<html lang="pt-br">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Tabelas</title>
    <style>
        body {
            font-family: Arial, Helvetica, sans-serif;
        }

        table {
            border-collapse: collapse;
            width: 300px;
            height: 300px;
            border: solid 2px red;
        }

        td {
            border: solid 1px black;
            padding: 4px;
            text-align: center;
            vertical-align: middle;
        }
        col.col1 {
            background-color: aqua;
        }
        col.col2 {
            background-color: rgb(204, 0, 255);
        }
        col.col3 {
            background-color: rgb(255, 217, 0);
        }
    </style>
</head>
<body>
    <h1>Minha primeira tabela</h1>
    <table>
        <colgroup>
        <col class="col1">
        <col class="col2">
        <col class="col3">
        </colgroup>
        <thead>
            <tr>
                <td>A1</td>
                <td>A2</td>
                <td>A3</td>
            </tr>
        </thead>
        <tbody>
            <tr>
                <td>B1</td>
                <td>B2</td>
                <td>B3</td>
            </tr>
        </tbody>
        <tfoot>
            <tr>
                <td>C1</td>
                <td>C2</td>
                <td>C3</td>
            </tr>
        </tfoot>
    </table>
</body>
</html>

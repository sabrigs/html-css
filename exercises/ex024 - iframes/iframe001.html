<!DOCTYPE html>
<html lang="pt-br">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>iframes</title>
</head>
<body>
    <h1>Testando o uso de iframes</h1>
    <p>
        Alguns sites não funcionam com iframe, por exemplo o site do Google:
        <iframe src="https://google.com/" frameborder="1">
            Nesse caso, temos que deixar um link alternativo para acessar o <a href="https://google.com/">Google</a>
        </iframe>
    </p>
    <p>
        Mas outros sites, como o meu site pessoal no repositório do Github, funcionam:
        <iframe src="https://sabrigs.github.io/" frameborder="1"></iframe>
    </p>
    <p>
        Podemos também estilizar o iframe.
        <iframe src="https://sabrigs.github.io/" frameborder="1" height="500" width="600" scrolling="yes">
            Para acessar o conteúdo, acesse
            <a href="https://sabrigs.github.io/">
                https://sabrigs.github.io/
            </a>
        </iframe>
    </p>
</body>
</html>

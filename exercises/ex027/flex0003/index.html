<!DOCTYPE html>
<html lang="pt-br">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Flexible Box</title>
    <style>
        div.container {
            background-color: lightsalmon;
            display: flex;
            flex-flow: row wrap;
            
            /*
            flex-direction: row; linha
            flex-direction: row-reverse; direita -> esquerda
            flex-direction: column;
            flex-direction: column-reverse;
            */
        }

        div.item {
            background-color: lightblue;
            border: 1px solid grey;
            text-align: center;   
            flex: auto;
        }
    </style>
</head>
<body>
    <div class="container">
        <div class="item">Exemplo A</div>
        <div class="item">Exemplo B</div>
        <div class="item">Exemplo C</div>
        <div class="item">Exemplo D</div>
        <div class="item">Exemplo E</div>
        <div class="item">Exemplo F</div>
        <div class="item">Exemplo G</div>
        <div class="item">Exemplo H</div>
        <div class="item">Exemplo I</div>
        <div class="item">Exemplo J</div>
        <div class="item">Exemplo K</div>
    </div>
</body>
</html>
